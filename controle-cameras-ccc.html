<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Câmeras CCC</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --archive: #95a5a6;
            --text: #333;
            --card-bg: #fff;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); }
        
        /* TELA DE LOGIN */
        #login-container { height: 100vh; display: flex; justify-content: center; align-items: center; background-color: var(--primary); }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { color: var(--primary); margin-bottom: 20px; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
        .btn-login { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #2980b9; }
        #login-error { color: var(--danger); margin-top: 10px; font-size: 14px; font-weight: bold; display: none; }

        /* PAINEL (Oculto por padrão) */
        #app-container { display: none; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--primary); color: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header-title-area { display: flex; flex-direction: column; gap: 5px; }
        .btn-logout { background: transparent; border: 1px solid white; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: fit-content; margin-top: 5px; }
        .btn-logout:hover { background: rgba(255,255,255,0.1); }
        
        .dashboard { display: flex; gap: 15px; }
        .stat-card { background: rgba(255,255,255,0.1); padding: 10px 20px; border-radius: 6px; text-align: center; min-width: 100px; }
        .stat-card span { display: block; font-size: 24px; font-weight: bold; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { padding: 10px 20px; border: none; background: #ddd; cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .tab-btn.active { background: var(--accent); color: white; }
        .tab-btn[data-group="ARQUIVADOS"].active { background: var(--archive); }
        
        .filters { display: flex; gap: 15px; align-items: center; }
        .filters select, .filters input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        .filters input { width: 250px; }
        
        .progress-bar { background: #e8f8f5; padding: 10px 15px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border: 1px solid #d1f2eb; color: #16a085; font-weight: bold; }
        .btn-reset { background: #16a085; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        
        table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; vertical-align: middle; }
        th { background-color: var(--primary); color: white; }
        tr:hover { background-color: #f9f9f9; }
        tr.row-checked { background-color: #eafaf1; }
        tr.row-checked td { opacity: 0.8; }
        
        .check-input { width: 22px; height: 22px; cursor: pointer; accent-color: var(--success); }
        select, .desc-input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; width: 100%; }
        .server-input { font-weight: bold; text-align: center; cursor: pointer; background-color: #f0f4f8; }
        
        .status-ok { background-color: var(--success); color: white; border: none; font-weight: bold; }
        .status-def { background-color: var(--danger); color: white; border: none; font-weight: bold; }
        .status-des { background-color: var(--archive); color: white; border: none; font-weight: bold; }
        
        .report-section { margin-top: 30px; background: var(--card-bg); padding: 20px; border-radius: 8px; }
        textarea { width: 100%; height: 200px; padding: 15px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; }
        .btn-action { margin-top: 10px; padding: 10px 20px; border: none; background: var(--accent); color: white; border-radius: 4px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-container">
        <div class="login-box">
            <h2>Acesso Restrito CCC</h2>
            <input type="email" id="email" class="login-input" placeholder="Seu E-mail">
            <input type="password" id="senha" class="login-input" placeholder="Sua Senha">
            <button class="btn-login" id="btn-entrar">Entrar no Sistema</button>
            <div id="login-error">Credenciais inválidas. Tente novamente.</div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="app-container">
        <header>
            <div class="header-title-area">
                <h1>Central de Controle de Câmeras</h1>
                <div id="connection-status" style="font-size: 13px; color: #2ecc71;">🟢 Sincronização Ativa</div>
                <button class="btn-logout" id="btn-sair">Sair do Sistema</button>
            </div>
            <div class="dashboard">
                <div class="stat-card">Ativos<span id="count-total">0</span></div>
                <div class="stat-card" style="color: #2ecc71;">OK<span id="count-ok">0</span></div>
                <div class="stat-card" style="color: #ff6b6b;">Defeito<span id="count-def">0</span></div>
            </div>
        </header>

        <div class="controls">
            <div class="tabs" id="tabs">
                <button class="tab-btn active" data-group="A">Grupo A</button>
                <button class="tab-btn" data-group="B">Grupo B</button>
                <button class="tab-btn" data-group="C">Grupo C</button>
                <button class="tab-btn" data-group="ARQUIVADOS" style="margin-left: 15px;">📥 Arquivados</button>
            </div>
            <div class="filters">
                <select id="filter-server">
                    <option value="ALL">Todos Servidores</option>
                    <option value="INTEL">INTEL</option>
                    <option value="HIK">HIK</option>
                </select>
                <input type="text" id="search" placeholder="Pesquisar...">
            </div>
        </div>

        <div class="progress-bar" id="progress-bar-container">
            <span id="progress-text">Verificados: 0 / 0</span>
            <button class="btn-reset" id="btn-reset">Limpar Vistos</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 60px; text-align: center;">Visto</th>
                    <th>Condomínio</th>
                    <th style="width: 140px;">Estado</th>
                    <th style="width: 130px;">Servidor ⮂</th>
                    <th>Descrição</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>

        <div class="report-section">
            <h3 id="report-title">Relatório</h3>
            <textarea id="report-output" readonly></textarea>
            <button class="btn-action" id="btn-generate-report">Gerar Relatório</button>
            <button class="btn-action" id="btn-copy-report" style="background: var(--success);">Copiar</button>
        </div>
    </div>

    <!-- Módulo do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
  apiKey: "AIzaSyBB1u1pWpE4kdnLSuGsbLWqAtOn3Bo9MRk",
  authDomain: "ccc-controle-cameras.firebaseapp.com",
  projectId: "ccc-controle-cameras",
  storageBucket: "ccc-controle-cameras.firebasestorage.app",
  messagingSenderId: "989470263859",
  appId: "1:989470263859:web:d1f4c6200e3581d841b146"
};


        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const docRef = doc(db, "controle", "cameras");

        let cameraData = [];
        let currentGroup = 'A';
        let unsubscribeSnapshot = null;

        // --- SISTEMA DE LOGIN ---
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const loginError = document.getElementById('login-error');

        // Monitora o estado da sessão (se o usuário está logado ou não)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Usuário logado: esconde tela de login e mostra o painel
                loginContainer.style.display = 'none';
                appContainer.style.display = 'block';
                iniciarSincronizacao(); // Começa a puxar os dados do banco
            } else {
                // Usuário deslogado
                loginContainer.style.display = 'flex';
                appContainer.style.display = 'none';
                if(unsubscribeSnapshot) unsubscribeSnapshot(); // Para de puxar dados
            }
        });

        // Botão de Entrar
        document.getElementById('btn-entrar').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            loginError.style.display = 'none';
            
            signInWithEmailAndPassword(auth, email, senha)
                .catch((error) => {
                    console.error(error);
                    loginError.style.display = 'block';
                });
        });

        // Botão de Sair
        document.getElementById('btn-sair').addEventListener('click', () => {
            signOut(auth);
        });

        // --- SISTEMA DO PAINEL ---
        function iniciarSincronizacao() {
            unsubscribeSnapshot = onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    cameraData = snapshot.data().lista || [];
                    renderTable();
                }
            }, (error) => {
                console.error("Erro no Firebase:", error);
                document.getElementById('connection-status').innerHTML = "🔴 Erro de Conexão";
            });
        }

        async function updateFirebase() {
            try { await setDoc(docRef, { lista: cameraData }); } 
            catch (e) { console.error("Erro ao salvar:", e); }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const serverFilter = document.getElementById('filter-server').value;
            
            let okCount = 0, defCount = 0, activeCount = 0, groupTotal = 0, groupChecked = 0;

            let filteredData = cameraData.filter(item => {
                if (item.status !== 'DES') {
                    activeCount++;
                    if (item.status === 'OK') okCount++;
                    if (item.status === 'DEF') defCount++;
                }
                
                let matchGroup = (currentGroup === 'ARQUIVADOS') ? (item.status === 'DES') : (item.group === currentGroup && item.status !== 'DES');

                if (matchGroup) {
                    groupTotal++;
                    if (item.checked) groupChecked++;
                }

                const matchSearch = item.name.toLowerCase().includes(searchTerm);
                const matchServer = serverFilter === 'ALL' || item.server === serverFilter;

                return matchGroup && matchSearch && matchServer;
            });

            filteredData.sort((a, b) => a.name.localeCompare(b.name));

            document.getElementById('count-total').innerText = activeCount;
            document.getElementById('count-ok').innerText = okCount;
            document.getElementById('count-def').innerText = defCount;
            document.getElementById('progress-text').innerText = `Verificados: ${groupChecked} de ${groupTotal}`;
            document.getElementById('report-title').innerText = `Geração de Relatório - ${currentGroup}`;
            document.getElementById('progress-bar-container').style.display = (currentGroup === 'ARQUIVADOS') ? 'none' : 'flex';

            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                if(item.checked) tr.classList.add('row-checked');
                
                let statusClass = item.status === 'DEF' ? 'status-def' : (item.status === 'DES' ? 'status-des' : 'status-ok');
                const descDisabled = (item.status === 'OK' && currentGroup !== 'ARQUIVADOS') ? 'disabled' : '';

                tr.innerHTML = `
                    <td style="text-align: center;"><input type="checkbox" class="check-input" ${item.checked ? 'checked' : ''} data-id="${item.id}" data-action="check"></td>
                    <td><strong>${item.name}</strong></td>
                    <td>
                        <select class="${statusClass}" data-id="${item.id}" data-action="status">
                            <option value="OK" ${item.status === 'OK' ? 'selected' : ''}>OK</option>
                            <option value="DEF" ${item.status === 'DEF' ? 'selected' : ''}>DEF</option>
                            <option value="DES" ${item.status === 'DES' ? 'selected' : ''}>Desativado</option>
                        </select>
                    </td>
                    <td><input type="text" class="desc-input server-input" value="${item.server}" readonly data-id="${item.id}" data-action="server-dbl"></td>
                    <td><input type="text" class="desc-input" value="${item.desc}" data-id="${item.id}" data-action="desc" ${descDisabled}></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Lógica de CLIQUES e ALTERAÇÕES
        document.getElementById('table-body').addEventListener('change', (e) => {
            const index = cameraData.findIndex(i => i.id === parseInt(e.target.dataset.id));
            if (index !== -1) {
                if (e.target.dataset.action === 'check') cameraData[index].checked = e.target.checked;
                if (e.target.dataset.action === 'status') {
                    cameraData[index].status = e.target.value;
                    if (e.target.value === 'OK') cameraData[index].desc = '';
                }
                if (e.target.dataset.action === 'desc') cameraData[index].desc = e.target.value;
                updateFirebase();
            }
        });

        document.getElementById('table-body').addEventListener('dblclick', (e) => {
            if (e.target.dataset.action === 'server-dbl') {
                const index = cameraData.findIndex(i => i.id === parseInt(e.target.dataset.id));
                if (index !== -1) {
                    cameraData[index].server = cameraData[index].server === 'HIK' ? 'INTEL' : 'HIK';
                    updateFirebase();
                }
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm(`Limpar vistos do GRUPO ${currentGroup}?`)) {
                cameraData.forEach(d => { if (d.group === currentGroup && d.status !== 'DES') d.checked = false; });
                updateFirebase();
            }
        });

        document.getElementById('btn-generate-report').addEventListener('click', () => {
            if (currentGroup === 'ARQUIVADOS') return;
            const today = new Date().toLocaleDateString('pt-BR');
            let reportStr = `RELAÇÃO CÂMERAS COM DEFEITO DIA → ${today}\n\n                                        \`GRUPO ${currentGroup}\`\n\n`;
            const defItems = cameraData.filter(d => d.group === currentGroup && d.status === 'DEF');
            
            if (defItems.length > 0) {
                defItems.sort((a, b) => a.name.localeCompare(b.name)).forEach(item => reportStr += `- CCC DEFEITO ${item.name} → ${item.desc}\n\n`);
            } else { reportStr += "Nenhum equipamento com defeito registrado.\n"; }
            document.getElementById('report-output').value = reportStr;
        });

        document.getElementById('btn-copy-report').addEventListener('click', () => {
            document.getElementById('report-output').select();
            document.execCommand('copy');
            alert('Copiado!');
        });

        document.getElementById('search').addEventListener('input', renderTable);
        document.getElementById('filter-server').addEventListener('change', renderTable);
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentGroup = e.target.dataset.group;
                document.getElementById('report-output').value = '';
                renderTable();
            });
        });
    </script>
</body>
</html>
