<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Câmeras CCC - Dark Mode</title>
    <style>
        /* TEMA ESCURO AZULADO */
        :root {
            --bg-color: #0f172a;        /* Azul escuro profundo (fundo) */
            --primary: #1e293b;         /* Azul ardósia (cards e header) */
            --accent: #3b82f6;          /* Azul vibrante (botões ativos) */
            --success: #10b981;         /* Verde esmeralda */
            --danger: #ef4444;          /* Vermelho suave */
            --archive: #64748b;         /* Cinzento azulado */
            --text: #f8fafc;            /* Branco gelo (texto principal) */
            --text-muted: #94a3b8;      /* Cinzento claro (texto secundário) */
            --border: #334155;          /* Linhas divisórias */
            --input-bg: #0f172a;        /* Fundo dos campos de texto */
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text); }
        
        /* TELA DE LOGIN */
        #login-container { height: 100vh; display: flex; justify-content: center; align-items: center; background-color: var(--bg-color); }
        .login-box { background: var(--primary); padding: 40px; border-radius: 8px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { color: var(--text); margin-bottom: 20px; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 4px; font-size: 16px; }
        .btn-login { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-login:hover { background: #2563eb; }
        #login-error { color: var(--danger); margin-top: 10px; font-size: 14px; font-weight: bold; display: none; }

        /* PAINEL PRINCIPAL */
        #app-container { display: none; padding: 20px; }
        
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: var(--primary); color: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .header-title-area { display: flex; flex-direction: column; gap: 5px; }
        .btn-logout { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; width: fit-content; margin-top: 5px; }
        .btn-logout:hover { background: var(--border); color: var(--text); }
        
        .dashboard { display: flex; gap: 15px; }
        .stat-card { background: rgba(0,0,0,0.2); padding: 10px 20px; border-radius: 6px; border: 1px solid var(--border); text-align: center; min-width: 100px; }
        .stat-card span { display: block; font-size: 24px; font-weight: bold; }
        
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 10px; flex-wrap: wrap; }
        .tabs { display: flex; gap: 10px; }
        .tab-btn { padding: 10px 20px; border: 1px solid var(--border); background: var(--primary); color: var(--text-muted); cursor: pointer; border-radius: 4px; font-weight: bold; transition: 0.3s; }
        .tab-btn:hover { background: var(--border); }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .tab-btn[data-group="ARQUIVADOS"].active { background: var(--archive); border-color: var(--archive); }
        
        .filters { display: flex; gap: 15px; align-items: center; }
        .filters select, .filters input { padding: 10px; border: 1px solid var(--border); background: var(--primary); color: var(--text); border-radius: 4px; }
        .filters input { width: 250px; }
        .filters input::placeholder { color: var(--text-muted); }
        
        .progress-bar { background: rgba(16, 185, 129, 0.1); padding: 10px 15px; border-radius: 6px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; border: 1px solid rgba(16, 185, 129, 0.2); color: var(--success); font-weight: bold; }
        .btn-reset { background: var(--success); color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .btn-reset:hover { background: #059669; }

        table { width: 100%; border-collapse: collapse; background: var(--primary); border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); vertical-align: middle; }
        th { background-color: #0f172a; color: var(--text-muted); font-weight: 600; text-transform: uppercase; font-size: 13px; }
        tr { transition: background-color 0.2s; }
        tr:hover { background-color: var(--border); }
        tr.row-checked { background-color: rgba(16, 185, 129, 0.15); }
        tr.row-checked td { opacity: 0.7; }
        
        .check-input { width: 20px; height: 20px; cursor: pointer; accent-color: var(--success); }
        select, .desc-input { padding: 8px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 4px; width: 100%; }
        .desc-input::placeholder { color: var(--text-muted); }
        .server-input { font-weight: bold; text-align: center; cursor: pointer; }
        .server-input:focus { outline: 1px solid var(--accent); }
        
        /* Cores de Estado dentro dos selects */
        .status-ok { background-color: rgba(16, 185, 129, 0.2); color: var(--success); font-weight: bold; border-color: var(--success); }
        .status-def { background-color: rgba(239, 68, 68, 0.2); color: var(--danger); font-weight: bold; border-color: var(--danger); }
        .status-des { background-color: rgba(100, 116, 139, 0.2); color: var(--archive); font-weight: bold; border-color: var(--archive); }
        
        .report-section { margin-top: 30px; background: var(--primary); padding: 20px; border-radius: 8px; border: 1px solid var(--border); }
        .report-section h3 { margin-bottom: 15px; color: var(--text); }
        textarea { width: 100%; height: 200px; padding: 15px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); border-radius: 4px; font-family: monospace; font-size: 14px; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .btn-action { padding: 10px 20px; border: none; background: var(--accent); color: white; border-radius: 4px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-action:hover { opacity: 0.8; }
        .btn-danger { background: var(--danger); }
        .btn-success { background: var(--success); }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-container">
        <div class="login-box">
            <h2>Acesso Restrito CCC</h2>
            <input type="email" id="email" class="login-input" placeholder="Seu E-mail">
            <input type="password" id="senha" class="login-input" placeholder="Sua Senha">
            <button class="btn-login" id="btn-entrar">Entrar no Sistema</button>
            <div id="login-error">Credenciais inválidas. Tente novamente.</div>
        </div>
    </div>

    <!-- PAINEL PRINCIPAL -->
    <div id="app-container">
        <header>
            <div class="header-title-area">
                <h1>Central de Controle de Câmeras</h1>
                <div id="connection-status" style="font-size: 13px; color: var(--success);">🟢 Sincronização Ativa</div>
                <button class="btn-logout" id="btn-sair">Sair do Sistema</button>
            </div>
            <div class="dashboard">
                <div class="stat-card">Ativos<span id="count-total" style="color: var(--text);">0</span></div>
                <div class="stat-card" style="color: var(--success);">OK<span id="count-ok">0</span></div>
                <div class="stat-card" style="color: var(--danger);">Defeito<span id="count-def">0</span></div>
            </div>
        </header>

        <div class="controls">
            <div class="tabs" id="tabs">
                <button class="tab-btn active" data-group="A">Grupo A</button>
                <button class="tab-btn" data-group="B">Grupo B</button>
                <button class="tab-btn" data-group="C">Grupo C</button>
                <button class="tab-btn" data-group="ARQUIVADOS" style="margin-left: 15px;">📥 Arquivados</button>
            </div>
            <div class="filters">
                <select id="filter-server">
                    <option value="ALL">Todos Servidores</option>
                    <option value="INTEL">INTEL</option>
                    <option value="HIK">HIK</option>
                </select>
                <input type="text" id="search" placeholder="Pesquisar...">
            </div>
        </div>

        <div class="progress-bar" id="progress-bar-container">
            <span id="progress-text">Verificados: 0 / 0</span>
            <button class="btn-reset" id="btn-reset">Limpar Vistos do Grupo</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 60px; text-align: center;">Visto</th>
                    <th>Condomínio</th>
                    <th style="width: 140px;">Estado</th>
                    <th style="width: 130px;">Servidor ⮂</th>
                    <th>Descrição do Defeito</th>
                </tr>
            </thead>
            <tbody id="table-body"></tbody>
        </table>

        <div class="report-section">
            <h3 id="report-title">Relatório do Turno</h3>
            <textarea id="report-output" readonly placeholder="O relatório gerado aparecerá aqui..."></textarea>
            <div class="btn-group">
                <button class="btn-action" id="btn-generate-report">Gerar Relatório</button>
                <button class="btn-action btn-success" id="btn-copy-report">Copiar</button>
                <button class="btn-action btn-danger" id="btn-clear-report">Apagar Relatório</button>
            </div>
        </div>
    </div>

    <!-- Módulo do Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // ==========================================
        // COLOQUE SUAS CHAVES DO FIREBASE AQUI ABAIXO
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBB1u1pWpE4kdnLSuGsbLWqAtOn3Bo9MRk",
            authDomain: "ccc-controle-cameras.firebaseapp.com",
            projectId: "ccc-controle-cameras",
            storageBucket: "ccc-controle-cameras.firebasestorage.app",
            messagingSenderId: "989470263859",
            appId: "1:989470263859:web:d1f4c6200e3581d841b146"
        };
        // ==========================================

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const docRef = doc(db, "controle", "cameras");

        let cameraData = [];
        let currentGroup = 'A';
        let unsubscribeSnapshot = null;

        // --- SISTEMA DE LOGIN ---
        const loginContainer = document.getElementById('login-container');
        const appContainer = document.getElementById('app-container');
        const loginError = document.getElementById('login-error');

        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginContainer.style.display = 'none';
                appContainer.style.display = 'block';
                iniciarSincronizacao();
                verificarRelatorioSalvo(); // Carrega relatório se existir e estiver dentro das 12h
            } else {
                loginContainer.style.display = 'flex';
                appContainer.style.display = 'none';
                if(unsubscribeSnapshot) unsubscribeSnapshot();
            }
        });

        document.getElementById('btn-entrar').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            loginError.style.display = 'none';
            signInWithEmailAndPassword(auth, email, senha).catch(() => loginError.style.display = 'block');
        });

        document.getElementById('btn-sair').addEventListener('click', () => signOut(auth));

        // --- SISTEMA DO PAINEL ---
        function iniciarSincronizacao() {
            unsubscribeSnapshot = onSnapshot(docRef, (snapshot) => {
                if (snapshot.exists()) {
                    cameraData = snapshot.data().lista || [];
                    renderTable();
                }
            }, (error) => {
                console.error("Erro Firebase:", error);
                document.getElementById('connection-status').innerHTML = "🔴 Erro de Conexão";
                document.getElementById('connection-status').style.color = "var(--danger)";
            });
        }

        async function updateFirebase() {
            try { await setDoc(docRef, { lista: cameraData }); } 
            catch (e) { console.error("Erro ao salvar:", e); }
        }

        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            const searchTerm = document.getElementById('search').value.toLowerCase();
            const serverFilter = document.getElementById('filter-server').value;
            
            let okCount = 0, defCount = 0, activeCount = 0, groupTotal = 0, groupChecked = 0;

            let filteredData = cameraData.filter(item => {
                if (item.status !== 'DES') {
                    activeCount++;
                    if (item.status === 'OK') okCount++;
                    if (item.status === 'DEF') defCount++;
                }
                
                let matchGroup = (currentGroup === 'ARQUIVADOS') ? (item.status === 'DES') : (item.group === currentGroup && item.status !== 'DES');

                if (matchGroup) {
                    groupTotal++;
                    if (item.checked) groupChecked++;
                }

                return matchGroup && item.name.toLowerCase().includes(searchTerm) && (serverFilter === 'ALL' || item.server === serverFilter);
            });

            filteredData.sort((a, b) => a.name.localeCompare(b.name));

            document.getElementById('count-total').innerText = activeCount;
            document.getElementById('count-ok').innerText = okCount;
            document.getElementById('count-def').innerText = defCount;
            document.getElementById('progress-text').innerText = `Verificados no Grupo ${currentGroup}: ${groupChecked} de ${groupTotal}`;
            document.getElementById('report-title').innerText = `Geração de Relatório - Grupo ${currentGroup}`;
            document.getElementById('progress-bar-container').style.display = (currentGroup === 'ARQUIVADOS') ? 'none' : 'flex';

            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                if(item.checked) tr.classList.add('row-checked');
                
                let statusClass = item.status === 'DEF' ? 'status-def' : (item.status === 'DES' ? 'status-des' : 'status-ok');
                const descDisabled = (item.status === 'OK' && currentGroup !== 'ARQUIVADOS') ? 'disabled' : '';

                tr.innerHTML = `
                    <td style="text-align: center;"><input type="checkbox" class="check-input" ${item.checked ? 'checked' : ''} data-id="${item.id}" data-action="check"></td>
                    <td><strong>${item.name}</strong></td>
                    <td>
                        <select class="${statusClass}" data-id="${item.id}" data-action="status">
                            <option value="OK" ${item.status === 'OK' ? 'selected' : ''}>OK</option>
                            <option value="DEF" ${item.status === 'DEF' ? 'selected' : ''}>DEF</option>
                            <option value="DES" ${item.status === 'DES' ? 'selected' : ''}>Desativado</option>
                        </select>
                    </td>
                    <td><input type="text" class="desc-input server-input" value="${item.server}" readonly data-id="${item.id}" data-action="server-dbl"></td>
                    <td><input type="text" class="desc-input" value="${item.desc}" data-id="${item.id}" data-action="desc" ${descDisabled}></td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Lógica de CLIQUES e ALTERAÇÕES
        document.getElementById('table-body').addEventListener('change', (e) => {
            const index = cameraData.findIndex(i => i.id === parseInt(e.target.dataset.id));
            if (index !== -1) {
                if (e.target.dataset.action === 'check') cameraData[index].checked = e.target.checked;
                if (e.target.dataset.action === 'status') {
                    cameraData[index].status = e.target.value;
                    if (e.target.value === 'OK') cameraData[index].desc = '';
                }
                if (e.target.dataset.action === 'desc') cameraData[index].desc = e.target.value;
                updateFirebase();
            }
        });

        document.getElementById('table-body').addEventListener('dblclick', (e) => {
            if (e.target.dataset.action === 'server-dbl') {
                const index = cameraData.findIndex(i => i.id === parseInt(e.target.dataset.id));
                if (index !== -1) {
                    cameraData[index].server = cameraData[index].server === 'HIK' ? 'INTEL' : 'HIK';
                    updateFirebase();
                }
            }
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            if (confirm(`Limpar vistos do GRUPO ${currentGroup}?`)) {
                cameraData.forEach(d => { if (d.group === currentGroup && d.status !== 'DES') d.checked = false; });
                updateFirebase();
            }
        });

        // --- SISTEMA DE RELATÓRIO MELHORADO ---
        
        // Função para formatar o texto: "PORTAO; CAMERA" vira "Portao; Camera"
        function formatarDescricao(texto) {
            if (!texto) return "";
            return texto.split(';')
                .map(parte => parte.trim()) // Remove espaços extra em volta
                .filter(parte => parte.length > 0) // Ignora partes vazias caso haja um ; no fim
                .map(parte => {
                    let min = parte.toLowerCase();
                    return min.charAt(0).toUpperCase() + min.slice(1); // Primeira letra maiúscula
                })
                .join('; '); // Junta com ; seguido de um espaço
        }

        function salvarRelatorioMemoria(texto) {
            const relatorioData = { texto: texto, timestamp: Date.now() };
            localStorage.setItem('relatorio_ccc', JSON.stringify(relatorioData));
            agendarLimpezaRelatorio(12 * 60 * 60 * 1000); // Agenda para 12h
        }

        function limparRelatorio() {
            document.getElementById('report-output').value = '';
            localStorage.removeItem('relatorio_ccc');
        }

        let timeoutLimpeza = null;
        function agendarLimpezaRelatorio(tempoRestante) {
            if(timeoutLimpeza) clearTimeout(timeoutLimpeza);
            timeoutLimpeza = setTimeout(limparRelatorio, tempoRestante);
        }

        function verificarRelatorioSalvo() {
            const guardado = localStorage.getItem('relatorio_ccc');
            if (guardado) {
                const dados = JSON.parse(guardado);
                const dozeHorasEmMs = 12 * 60 * 60 * 1000;
                const tempoPassado = Date.now() - dados.timestamp;
                
                if (tempoPassado > dozeHorasEmMs) {
                    limparRelatorio(); // Já expirou
                } else {
                    document.getElementById('report-output').value = dados.texto;
                    agendarLimpezaRelatorio(dozeHorasEmMs - tempoPassado); // Continua contagem
                }
            }
        }

        document.getElementById('btn-generate-report').addEventListener('click', () => {
            if (currentGroup === 'ARQUIVADOS') return;
            
            // Pergunta o dia
            const dataAtual = new Date();
            let diaInput = prompt("Qual o dia do relatório?", dataAtual.getDate());
            
            if (!diaInput) return; // Se o utilizador clicar cancelar

            // Formata a data com o mês e ano do sistema
            diaInput = diaInput.toString().padStart(2, '0');
            const mesStr = dataAtual.toLocaleDateString('pt-BR', { month: 'long' });
            const anoStr = dataAtual.getFullYear();
            const dataCabecalho = `${diaInput} de ${mesStr} de ${anoStr}`;

            let reportStr = `RELAÇÃO CÂMERAS COM DEFEITO DIA → ${dataCabecalho}\n\n`;
            reportStr += `                                        \`GRUPO ${currentGroup}\`\n\n`;
            
            const defItems = cameraData.filter(d => d.group === currentGroup && d.status === 'DEF');
            
            if (defItems.length > 0) {
                defItems.sort((a, b) => a.name.localeCompare(b.name)).forEach(item => {
                    const descFormatada = formatarDescricao(item.desc);
                    reportStr += `- CCC DEFEITO ${item.name} → ${descFormatada}\n\n`;
                });
            } else { 
                reportStr += "Nenhum equipamento com defeito registrado.\n"; 
            }
            
            document.getElementById('report-output').value = reportStr;
            salvarRelatorioMemoria(reportStr);
        });

        document.getElementById('btn-copy-report').addEventListener('click', () => {
            document.getElementById('report-output').select();
            document.execCommand('copy');
        });

        document.getElementById('btn-clear-report').addEventListener('click', () => {
            if(confirm("Tem a certeza que deseja apagar o relatório desta caixa de texto?")) {
                limparRelatorio();
            }
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentGroup = e.target.dataset.group;
                renderTable();
            });
        });
        
        document.getElementById('search').addEventListener('input', renderTable);
        document.getElementById('filter-server').addEventListener('change', renderTable);
    </script>
</body>
</html>
